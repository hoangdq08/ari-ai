  #     dockerfile: Dockerfile
  #   container_name: argiai_backend
  #   ports:
  #     - "8000:8000"
  #   restart: unless-stopped
  #   environment:
  #     - ENVIRONMENT=production
  #   networks:
  #     - argiai_net

networks:
  argiai_net:
    driver: bridge
